<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadSOS AI Assistant</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.chat-container{
width:420px;
height:700px;
background:#1e293b;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

.header{
background:#2563eb;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-size:22px;
}

.status{
font-size:13px;
color:#b7ffb7;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:15px;
}

.bot,
.user{
max-width:75%;
padding:12px 15px;
border-radius:15px;
font-size:15px;
line-height:22px;
}

.bot{
background:#334155;
color:white;
align-self:flex-start;
}

.user{
background:#2563eb;
color:white;
align-self:flex-end;
}

.quick{
padding:10px;
display:flex;
gap:10px;
overflow:auto;
background:#172033;
}

.quick button{
border:none;
padding:8px 12px;
background:#334155;
color:white;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
}

.quick button:hover{
background:#2563eb;
}

.input-area{
display:flex;
padding:15px;
background:#111827;
gap:10px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:25px;
background:#334155;
color:white;
font-size:15px;
outline:none;
}

.send,.mic{
width:45px;
height:45px;
border:none;
border-radius:50%;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
}

.send:hover,
.mic:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<div class="chat-container">

<div class="header">
<div>
<h2>🤖 RoadSOS AI</h2>
<div class="status">● Online</div>
</div>

<i class="fa-solid fa-road"></i>
</div>

<div class="quick">
<button onclick="quick('Accident Advice')">🚑 Accident</button>
<button onclick="quick('First Aid')">🩹 First Aid</button>
<button onclick="quick('Traffic Rules')">🚦 Rules</button>
<button onclick="quick('Nearby Hospitals')">🏥 Hospital</button>
<button onclick="quick('Emergency Numbers')">📞 Emergency</button>
</div>

<div class="chat-box" id="chat">

<div class="bot">
👋 Hello! I am RoadSOS AI.<br><br>
How can I help you today?
</div>

</div>

<div class="input-area">

<input
id="msg"
placeholder="Ask about road safety..."
>

<button class="mic">
<i class="fa-solid fa-microphone"></i>
</button>

<button class="send" onclick="sendMessage()">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

</div>

<script>

const chat=document.getElementById("chat");

function addMessage(text,type){

const div=document.createElement("div");

div.className=type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();

if(text==="") return;

addMessage(text,"user");

setTimeout(()=>{

addMessage("This is a demo response. Connect this UI with OpenAI API to get real AI answers.","bot");

},700);

input.value="";

}

function quick(text){

document.getElementById("msg").value=text;

sendMessage();

}

</script>

</body>
</html>
